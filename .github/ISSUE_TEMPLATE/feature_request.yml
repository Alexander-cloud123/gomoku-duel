name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: motivation
    attributes:
      label: 使用场景与动机
      description: 你在什么场景下遇到了什么问题？为什么现有功能不够用？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望如何解决？如果有多个方案也请一并说明
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法（可选）

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 联机对战
        - 人机对战 / AI
        - 围棋规则与计分
        - 界面与交互
        - 工程 / 文档 / 部署
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue 与文档，确认不是已有功能
          required: true
