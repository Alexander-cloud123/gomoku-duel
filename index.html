<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="浏览器五子棋 / 围棋：WebRTC 点对点联机、本地 AI 辅助与人机对战">
    <meta name="theme-color" content="#F5F7FA">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <title>棋盘对弈 · 五子棋 / 围棋</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- 首页 -->
        <section id="page-home" class="page active" aria-label="首页">
            <div class="home-shell">
                <header class="brand">
                    <h1 class="page-focus" tabindex="-1">棋盘对弈</h1>
                    <p>五子棋 · 围棋　支持点对点联机与本地 AI</p>
                </header>

                <div class="mode-select" role="tablist" aria-label="选择棋种">
                    <button id="btn-mode-gomoku" class="mode-card active" data-mode="gomoku" role="tab" aria-selected="true">
                        <span class="mode-icon" aria-hidden="true">⚫</span>
                        <span class="mode-name">五子棋</span>
                        <span class="mode-desc">15 路 · 五连胜负 · 无禁手</span>
                    </button>
                    <button id="btn-mode-go" class="mode-card" data-mode="go" role="tab" aria-selected="false">
                        <span class="mode-icon" aria-hidden="true">⚪</span>
                        <span class="mode-name">围棋</span>
                        <span class="mode-desc">9 / 13 / 19 路 · 数子计分</span>
                    </button>
                </div>

                <div class="play-tabs" role="tablist" aria-label="对战方式">
                    <button id="tab-online" class="play-tab active" role="tab" aria-selected="true">联机对战</button>
                    <button id="tab-local" class="play-tab" role="tab" aria-selected="false">人机对战</button>
                </div>

                <section class="settings-card" aria-label="对局设置">
                    <div class="setting-row">
                        <label for="input-name">昵称</label>
                        <input id="input-name" type="text" maxlength="24" autocomplete="nickname" placeholder="玩家">
                    </div>
                    <div id="go-only-settings" hidden>
                        <div class="setting-row">
                            <label for="select-go-size">棋盘</label>
                            <select id="select-go-size">
                                <option value="9">9 路</option>
                                <option value="13">13 路</option>
                                <option value="19">19 路</option>
                            </select>
                        </div>
                        <div class="setting-row">
                            <label for="select-komi">白贴目</label>
                            <select id="select-komi">
                                <option value="5.5">5.5 目</option>
                                <option value="6.5">6.5 目</option>
                                <option value="7.5">7.5 目</option>
                            </select>
                        </div>
                    </div>
                    <div class="setting-row">
                        <label for="select-difficulty">人机难度</label>
                        <select id="select-difficulty">
                            <option value="easy">入门</option>
                            <option value="medium">进阶</option>
                            <option value="hard">高手</option>
                        </select>
                    </div>
                    <div class="setting-row switch-row">
                        <label for="toggle-assist">AI 辅助提示</label>
                        <input id="toggle-assist" class="switch" type="checkbox" checked>
                    </div>
                    <div class="setting-row switch-row">
                        <label for="toggle-sound">落子音效</label>
                        <input id="toggle-sound" class="switch" type="checkbox" checked>
                    </div>
                </section>

                <div id="online-actions" class="action-stack">
                    <button id="btn-host" class="btn btn-primary btn-block">创建房间</button>
                    <button id="btn-join" class="btn btn-secondary btn-block">加入房间</button>
                </div>
                <div id="local-actions" class="action-stack" hidden>
                    <button id="btn-start-local" class="btn btn-primary btn-block">开始人机对战</button>
                    <p class="hint">你执黑先行，AI 执白</p>
                </div>

                <p class="home-stats">本地战绩 <span id="stats-text">0 胜 / 0 负 / 0 和</span></p>
            </div>
        </section>

        <!-- 等待页 -->
        <section id="page-waiting" class="page" aria-label="等待对手">
            <div class="center-card">
                <h2 class="page-focus" tabindex="-1">等待对手加入</h2>
                <div id="waiting-mode" class="mode-badge">五子棋</div>
                <div class="room-block">
                    <span class="room-label">房间号</span>
                    <div id="room-code" class="room-code">------</div>
                </div>
                <div class="button-row">
                    <button id="btn-copy-code" class="btn btn-secondary btn-small">复制房间号</button>
                    <button id="btn-copy-link" class="btn btn-secondary btn-small">复制邀请链接</button>
                </div>
                <p class="hint">把房间号或链接发给对手，对方点击「加入房间」输入即可</p>
                <div class="waiting-dots" aria-hidden="true"><span></span><span></span><span></span></div>
                <button id="btn-cancel-wait" class="btn btn-text-danger">取消</button>
            </div>
        </section>

        <!-- 加入页 -->
        <section id="page-join" class="page" aria-label="加入房间">
            <div class="center-card">
                <h2 class="page-focus" tabindex="-1">加入房间</h2>
                <p class="hint">输入房主给出的 6 位房间号</p>
                <input id="input-room" class="input-room" type="text" maxlength="8" autocomplete="off"
                       inputmode="latin" placeholder="例如 ABC234" aria-label="房间号">
                <div class="button-row">
                    <button id="btn-join-confirm" class="btn btn-primary">连接</button>
                    <button id="btn-cancel-join" class="btn btn-secondary">返回</button>
                </div>
            </div>
        </section>

        <!-- 对局页 -->
        <section id="page-game" class="page" aria-label="对局">
            <h1 class="sr-only page-focus" tabindex="-1">对局</h1>
            <header class="game-header">
                <span id="game-room-name" class="game-room-name">联机对战</span>
                <span id="conn-status" class="conn-status status-ok">已连接</span>
                <button id="btn-back-home" class="btn btn-ghost btn-small">返回首页</button>
            </header>

            <main class="game-main">
                <div class="board-area">
                    <div class="board-wrapper">
                        <canvas id="board" width="600" height="600" role="grid"
                                aria-label="棋盘" tabindex="0"></canvas>
                        <div id="turn-indicator" class="turn-indicator">轮到你落子</div>
                        <div id="thinking-indicator" class="thinking-indicator" hidden>
                            <span class="spinner" aria-hidden="true"></span> AI 思考中…
                        </div>
                    </div>
                    <section id="scoring-panel" class="scoring-panel" hidden aria-label="终局点目">
                        <div class="scoring-title">终局点目</div>
                        <p class="scoring-hint">点击棋组可标记 / 取消死子，双方确认后结算</p>
                        <p id="score-summary" class="score-summary"></p>
                        <p id="score-agree-state" class="score-state"></p>
                        <button id="btn-confirm-score" class="btn btn-primary btn-small">确认计分</button>
                    </section>
                </div>

                <aside class="sidebar">
                    <div id="ai-panel" class="panel ai-panel">
                        <div class="panel-head">
                            <h3>AI 辅助</h3>
                            <label class="switch-label" aria-label="开关 AI 辅助">
                                <input id="ai-toggle" class="switch" type="checkbox" checked>
                            </label>
                        </div>
                        <div class="ai-row">
                            <span class="ai-label">推荐</span>
                            <span id="ai-recommend" class="ai-value">--</span>
                        </div>
                        <div class="ai-row">
                            <span class="ai-label">评估</span>
                            <div class="winrate-bar"><div id="ai-winrate-fill" class="winrate-fill"></div></div>
                            <span id="ai-winrate-text" class="ai-value">50%</span>
                        </div>
                        <div class="ai-row">
                            <span class="ai-label">威胁</span>
                            <span id="ai-threat" class="ai-value ai-safe">安全</span>
                        </div>
                        <div id="ai-status" class="ai-status"></div>
                    </div>

                    <div class="panel meta-panel">
                        <h3>对局信息</h3>
                        <div class="meta-row"><span>模式</span><span id="info-mode">五子棋 · 15 路</span></div>
                        <div class="meta-row"><span>身份</span><span id="info-role">你执黑</span></div>
                        <div id="go-info" class="go-info" hidden>
                            <div class="meta-row"><span>提子</span><span id="go-captures">黑 0 / 白 0</span></div>
                            <div class="meta-row"><span>贴目</span><span id="go-komi">7.5</span></div>
                        </div>
                    </div>

                    <div class="panel op-panel">
                        <h3>操作</h3>
                        <div class="op-grid">
                            <button id="btn-undo" class="btn btn-small btn-secondary">悔棋</button>
                            <button id="btn-draw" class="btn btn-small btn-secondary">和棋</button>
                            <button id="btn-pass" class="btn btn-small btn-secondary" hidden>虚手</button>
                            <button id="btn-resign" class="btn btn-small btn-danger">认输</button>
                        </div>
                    </div>
                </aside>
            </main>

            <footer class="game-footer">
                <span class="footer-label">走子</span>
                <div id="move-history" class="move-history" aria-live="polite"></div>
            </footer>
        </section>

        <!-- 模态 -->
        <div id="modal-root" class="modal" hidden>
            <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
                <h2 id="modal-title" class="modal-title"></h2>
                <div id="modal-body" class="modal-body"></div>
                <div id="modal-actions" class="modal-actions"></div>
            </div>
        </div>

        <div id="toast-host" class="toast-host" aria-live="polite" aria-atomic="true"></div>
    </div>

    <script src="lib/peerjs.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
